<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --font: 'DM Sans', sans-serif;
  --brand-600: #533afd;
  --brand-500: #635BFF;
  --brand-400: #7f7dfc;
  --brand-300: #9a9afe;
  --brand-200: #b9b9f9;
  --brand-100: #d6d9fc;
  --brand-50: #e8e9ff;
  --brand-25: #f5f5ff;
  --text-solid: #031323;
  --text-primary: #425466;
  --text-secondary: #6b7c93;
  --text-tertiary: #8898aa;
  --surface-bg: #ffffff;
  --surface-bg-quiet: #f6f9fc;
  --surface-border: #e3e8ee;
  --dark-bg: #0a2540;
  --dark-bg-alt: #0c2d48;
  --nav-height: 76px;
}

html {
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  scroll-behavior: smooth;
}
body { background: var(--surface-bg); color: var(--text-primary); overflow-x: hidden; }

/* REVEAL ANIMATIONS */
.reveal { opacity:0; transform:translateY(30px); transition: opacity 0.7s cubic-bezier(.16,1,.3,1), transform 0.7s cubic-bezier(.16,1,.3,1); }
.reveal.vis { opacity:1; transform:translateY(0); }

/* ===== NAV ===== */
.nav {
  position: fixed; top:0; left:0; right:0; z-index:1000;
  height: var(--nav-height);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 max(24px, calc((100vw - 1080px)/2));
  transition: background .3s, backdrop-filter .3s, box-shadow .3s;
}
.nav--scrolled {
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(16px) saturate(180%);
  box-shadow: 0 1px 0 var(--surface-border);
}
.nav__logo {
  font-size: 22px; font-weight: 600; color: var(--text-solid);
  text-decoration: none; letter-spacing: -.02em;
  display: flex; align-items: center; gap: 6px;
}
.nav__logo svg { display:block; }
.nav__links { display:flex; gap:28px; align-items:center; }
.nav__link {
  font-size: 15px; font-weight: 400; color: var(--text-primary);
  text-decoration: none; cursor:pointer; transition: color .15s;
  letter-spacing: -.01em;
}
.nav__link:hover { color: var(--brand-600); }
.nav__signin {
  font-size: 14px; font-weight: 500; color: var(--text-primary);
  text-decoration: none; padding: 6px 12px;
  background: rgba(10,37,64,.06); border-radius: 20px;
  transition: background .15s;
}
.nav__signin:hover { background: rgba(10,37,64,.1); }
.nav__cta {
  font-size: 14px; font-weight: 500; color:#fff;
  background: var(--brand-600); border:none; border-radius: 20px;
  padding: 8px 14px; cursor:pointer; font-family: var(--font);
  transition: transform .15s, box-shadow .15s;
  display: flex; align-items: center; gap: 4px;
}
.nav__cta:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(83,58,253,.35); }
.nav__cta svg { transition: transform .15s; }
.nav__cta:hover svg { transform: translateX(2px); }

/* ===== HERO ===== */
.hero {
  position: relative;
  min-height: min(85vh, 700px);
  background: var(--surface-bg);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.hero__content {
  position: relative; z-index: 2;
  padding: calc(var(--nav-height) + 48px) max(24px, calc((100vw - 1080px)/2)) 0;
  flex: 1; display: flex; flex-direction: column;
}
.hero__eyebrow {
  font-size: 14px; font-weight: 400; color: var(--text-secondary);
  margin-bottom: 20px; letter-spacing: -.01em;
}
.hero__eyebrow-val {
  font-variant-numeric: tabular-nums;
  font-weight: 500; color: var(--text-solid);
}
.hero__title {
  font-size: clamp(32px, 4.5vw, 48px);
  font-weight: 300;
  line-height: 1.05;
  letter-spacing: -.025em;
  color: var(--text-solid);
  max-width: 720px;
  margin-bottom: 20px;
}
.hero__title em {
  font-style: normal;
  font-weight: 300;
}
.hero__subtitle {
  font-size: clamp(15px, 1.5vw, 17px);
  font-weight: 400;
  line-height: 1.55;
  color: var(--text-secondary);
  max-width: 520px;
  margin-bottom: 28px;
  letter-spacing: -.01em;
}
.hero__actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-primary {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--brand-600); color:#fff; border:none;
  border-radius: 20px; padding: 10px 18px;
  font-size: 15px; font-weight: 500; cursor:pointer;
  font-family: var(--font); letter-spacing: -.01em;
  transition: transform .15s, box-shadow .15s;
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(83,58,253,.3); }
.btn-primary svg { transition: transform .15s; }
.btn-primary:hover svg { transform: translateX(2px); }
.btn-secondary {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface-bg); color: var(--text-solid);
  border: 1px solid var(--surface-border);
  border-radius: 20px; padding: 10px 18px;
  font-size: 15px; font-weight: 500; cursor:pointer;
  font-family: var(--font); letter-spacing: -.01em;
  transition: border-color .15s, transform .15s;
}
.btn-secondary:hover { border-color: var(--brand-400); transform: translateY(-1px); }

/* Wave canvas */
.hero__wave {
  position: absolute; bottom:0; left:0; right:0;
  height: 55%; z-index:1;
  pointer-events: none;
}
.hero__wave canvas { width:100%; height:100%; display:block; }

/* ===== LOGO CAROUSEL ===== */
.logos {
  position: relative; z-index: 2;
  margin: 0 max(24px, calc((100vw - 1080px)/2));
  border-top: 1px solid var(--surface-border);
  overflow: hidden;
  padding: 24px 0;
  -webkit-mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent);
          mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent);
}
.logos__track {
  display: flex; align-items: center;
  animation: logoScroll 40s linear infinite;
  width: max-content;
}
@keyframes logoScroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
.logos__item {
  padding: 0 32px;
  opacity: .35;
  transition: opacity .3s;
  white-space: nowrap;
  font-size: 20px; font-weight: 600; letter-spacing: -.02em;
  color: var(--text-solid);
}
.logos__item:hover { opacity: .6; }

/* ===== SECTION SHARED ===== */
.section {
  padding: 96px max(24px, calc((100vw - 1080px)/2));
}
.section--dark {
  background: var(--dark-bg); color: #fff;
}
.section__header {
  margin-bottom: 56px;
}
.section__header h2 {
  font-size: clamp(24px, 3vw, 36px);
  font-weight: 300; line-height: 1.15;
  letter-spacing: -.02em;
  color: var(--text-solid);
}
.section--dark .section__header h2 { color: #fff; }
.section__header p {
  font-size: 16px; font-weight: 400; line-height: 1.55;
  color: var(--text-secondary); margin-top: 12px;
  max-width: 560px; letter-spacing: -.01em;
}
.section--dark .section__header p { color: rgba(255,255,255,.6); }

/* ===== BENTO ===== */
.bento {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.bento__card {
  background: var(--surface-bg-quiet);
  border-radius: 12px; padding: 28px;
  position: relative; overflow: hidden;
  transition: transform .3s, box-shadow .3s;
  display: flex; flex-direction: column;
  min-height: 220px;
}
.bento__card:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,0,0,.06); }
.bento__card--span2 { grid-column: span 2; }
.bento__card-label {
  font-size: 11px; font-weight: 500; letter-spacing: .06em;
  text-transform: uppercase; color: var(--brand-600);
  margin-bottom: 12px;
}
.bento__card h3 {
  font-size: 18px; font-weight: 400; color: var(--text-solid);
  line-height: 1.3; letter-spacing: -.01em;
  margin-bottom: 8px;
}
.bento__card p {
  font-size: 14px; color: var(--text-secondary); line-height: 1.5;
}
.bento__card-visual {
  flex: 1; display: flex; align-items: flex-end; justify-content: flex-end;
  margin-top: 16px;
}
.bento__card-gradient {
  position: absolute; inset:0; opacity:.04; pointer-events:none;
}

/* ===== STATS MARQUEE ===== */
.stats {
  overflow: hidden; padding: 56px 0;
  background: var(--dark-bg);
}
.stats__track {
  display: flex;
  animation: marquee 25s linear infinite;
  width: max-content;
}
@keyframes marquee {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
.stats__item {
  padding: 0 56px;
  display: flex; flex-direction: column; align-items: center;
  white-space: nowrap;
}
.stats__val {
  font-size: clamp(32px, 4vw, 48px);
  font-weight: 300; color: #fff;
  letter-spacing: -.03em; line-height: 1;
}
.stats__label {
  font-size: 14px; color: rgba(255,255,255,.4);
  margin-top: 8px; letter-spacing: -.01em;
}

/* ===== ENTERPRISE ===== */
.enterprise {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px; align-items: start;
}
.accordion__item { border-bottom: 1px solid var(--surface-border); }
.accordion__btn {
  width:100%; background:none; border:none; text-align:left;
  padding: 18px 0; cursor:pointer; font-family: var(--font);
  font-size: 15px; font-weight: 400; color: var(--text-solid);
  display: flex; align-items: center; justify-content: space-between;
  letter-spacing: -.01em; transition: color .15s;
}
.accordion__btn:hover { color: var(--brand-600); }
.accordion__arrow {
  font-size: 10px; color: var(--text-tertiary);
  transition: transform .3s;
}
.accordion__arrow--open { transform: rotate(180deg); }
.accordion__body {
  max-height: 0; overflow: hidden;
  transition: max-height .5s cubic-bezier(.16,1,.3,1);
}
.accordion__body--open { max-height: 300px; }
.accordion__inner { padding: 0 0 18px; }
.accordion__inner p { font-size: 14px; color: var(--text-secondary); line-height: 1.55; }
.accordion__stats { display: flex; gap: 28px; margin-top: 14px; }
.accordion__stat-val {
  font-size: 22px; font-weight: 400; color: var(--brand-600);
  letter-spacing: -.02em;
}
.accordion__stat-label { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }

.enterprise__visual {
  background: var(--surface-bg-quiet);
  border-radius: 12px; aspect-ratio: 4/3;
  overflow: hidden; position: relative;
  display: flex; align-items: center; justify-content: center;
}
.enterprise__visual-inner {
  width:100%; height:100%;
  background: linear-gradient(135deg, var(--brand-50), var(--surface-bg-quiet));
  display: flex; align-items: center; justify-content: center;
}

/* ===== DEV SECTION ===== */
.dev { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
.code-window {
  background: var(--dark-bg); border-radius: 12px;
  overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.15);
}
.code-window__bar {
  padding: 14px 16px; display: flex; gap: 7px;
  background: rgba(255,255,255,.04);
}
.code-window__dot { width:11px; height:11px; border-radius:50%; }
.code-window__body {
  padding: 20px 24px;
  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  font-size: 13px; line-height: 1.8;
  color: rgba(255,255,255,.7);
  white-space: pre;
}
.code-kw { color: #ff80b5; }
.code-str { color: #7dd3a8; }
.code-fn { color: #80e1ff; }
.code-cm { color: rgba(255,255,255,.25); }

.dev__features { display: flex; flex-direction: column; gap: 24px; }
.dev__feat { display: flex; gap: 14px; }
.dev__feat-icon {
  width: 36px; height: 36px; min-width: 36px;
  border-radius: 8px; background: var(--brand-50);
  display: flex; align-items: center; justify-content: center;
  color: var(--brand-600); font-size: 16px;
}
.dev__feat h4 {
  font-size: 15px; font-weight: 500; color: var(--text-solid);
  margin-bottom: 3px; letter-spacing: -.01em;
}
.dev__feat p { font-size: 14px; color: var(--text-secondary); line-height: 1.5; }

.api-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-top: 40px; }
.api-stat {
  background: var(--surface-bg-quiet); border-radius: 10px; padding: 20px; text-align: center;
}
.api-stat__val {
  font-size: 24px; font-weight: 400; color: var(--brand-600);
  letter-spacing: -.02em;
}
.api-stat__label { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; }

/* ===== NEWS ===== */
.news-scroll {
  display: flex; gap: 16px;
  overflow-x: auto; scroll-snap-type: x mandatory;
  scrollbar-width: none; padding-bottom: 8px;
}
.news-scroll::-webkit-scrollbar { display:none; }
.news-card {
  min-width: 320px; max-width: 320px;
  scroll-snap-align: start;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 12px; padding: 28px;
  transition: background .2s, transform .2s;
  cursor: pointer;
}
.news-card:hover { background: rgba(255,255,255,.08); transform: translateY(-3px); }
.news-card__tag {
  font-size: 11px; font-weight: 500; text-transform: uppercase;
  letter-spacing: .06em; color: var(--brand-300); margin-bottom: 14px;
}
.news-card h3 {
  font-size: 16px; font-weight: 400; color: #fff;
  line-height: 1.4; margin-bottom: 10px; letter-spacing: -.01em;
}
.news-card p { font-size: 13px; color: rgba(255,255,255,.4); line-height: 1.5; }
.news-card__link {
  display: inline-flex; align-items: center; gap: 4px;
  margin-top: 14px; font-size: 13px; font-weight: 500;
  color: var(--brand-300); text-decoration: none;
  transition: color .15s;
}
.news-card__link:hover { color: #fff; }

/* ===== CTA ===== */
.cta { text-align: center; }
.cta h2 {
  font-size: clamp(24px, 3vw, 36px);
  font-weight: 300; letter-spacing: -.02em;
  color: var(--text-solid); margin-bottom: 12px;
}
.cta p {
  font-size: 16px; color: var(--text-secondary);
  margin-bottom: 28px; max-width: 440px; margin-inline: auto;
}
.cta__btns { display: flex; gap: 8px; justify-content: center; }
.cta__sub {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  max-width: 480px; margin: 40px auto 0;
}
.cta__sub-item { text-align: left; }
.cta__sub-item h4 {
  font-size: 14px; font-weight: 500; color: var(--text-solid);
  margin-bottom: 4px;
}
.cta__sub-item p { font-size: 13px; color: var(--text-tertiary); }
.cta__sub-item a { font-size: 13px; color: var(--brand-600); text-decoration: none; }

/* ===== FOOTER ===== */
.footer { background: var(--dark-bg); padding: 64px max(24px, calc((100vw - 1080px)/2)) 32px; }
.footer__grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px; margin-bottom: 40px; }
.footer__col h4 { font-size: 13px; font-weight: 500; color: rgba(255,255,255,.7); margin-bottom: 14px; }
.footer__col a {
  display: block; font-size: 13px; color: rgba(255,255,255,.35);
  text-decoration: none; padding: 3px 0; transition: color .15s;
}
.footer__col a:hover { color: rgba(255,255,255,.7); }
.footer__bottom {
  border-top: 1px solid rgba(255,255,255,.08);
  padding-top: 24px; display: flex; justify-content: space-between; align-items: center;
}
.footer__logo { font-size: 18px; font-weight: 600; color: var(--brand-400); letter-spacing: -.02em; }
.footer__copy { font-size: 12px; color: rgba(255,255,255,.3); }

/* ===== STATS GRID ===== */
.stats-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px;
  padding-bottom: 40px;
}
.stats-grid__item { text-align: center; }
.stats-grid__val {
  font-size: clamp(28px, 3.5vw, 42px);
  font-weight: 300; color: var(--text-solid);
  letter-spacing: -.03em; line-height: 1;
}
.stats-grid__label {
  font-size: 13px; color: var(--text-tertiary);
  margin-top: 8px; line-height: 1.4;
  white-space: pre-line;
}
.stats-viz {
  margin-top: 8px;
  background: var(--surface-bg-quiet);
  border-radius: 12px;
  overflow: hidden;
}

/* ===== BENTO EXTRAS ===== */
.bento__card-top {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 4px;
}
.bento__card-top h3 {
  font-size: 17px; font-weight: 400; color: var(--text-solid);
  line-height: 1.3; letter-spacing: -.01em;
  max-width: 85%;
}
.bento__expand {
  font-size: 14px; color: var(--text-tertiary);
  width: 28px; height: 28px; border-radius: 14px;
  background: rgba(0,0,0,.04);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

/* ===== HERO TITLE SUB ===== */
.hero__title-sub {
  color: var(--text-secondary);
  font-weight: 300;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .nav__links { display: none; }
  .bento { grid-template-columns: 1fr; }
  .bento__card--span2 { grid-column: span 1; }
  .enterprise { grid-template-columns: 1fr; }
  .dev { grid-template-columns: 1fr; }
  .api-stats { grid-template-columns: 1fr; }
  .footer__grid { grid-template-columns: repeat(2, 1fr); }
}

/* Logo SVG (hardcoded width=60 clipped "payflow") */
.nav__logo svg { width: 90px !important; }

/* Hide original hero canvas — replaced by custom WebGL shader */
.hero > canvas:not(.pf-shader) { display: none !important; }
.hero > canvas.pf-shader { position: absolute !important; inset: 0 !important; width: 100% !important; height: 100% !important; z-index: 0 !important; pointer-events: none; }

/* News grid: 4 gleich breite Cards in einer Reihe */
[style*="grid-template-columns: 2fr 1fr 1fr"] { grid-template-columns: repeat(4, 1fr) !important; }
[style*="grid-template-columns: 2fr 1fr 1fr"] > div > div[style*="height: 160px"],
[style*="grid-template-columns: 2fr 1fr 1fr"] > div > div[style*="height: 280px"] { height: 280px !important; }
[style*="grid-template-columns: 2fr 1fr 1fr"] > div > div[style*="height: 160px"]::after { content: attr(data-label); }
[style*="grid-template-columns: 2fr 1fr 1fr"] > div:nth-child(2) > div::after { content: "Café Roastery\A Case Study"; white-space: pre; color:#fff; font-size: 22px; font-weight:300; line-height:1.2; }
[style*="grid-template-columns: 2fr 1fr 1fr"] > div:nth-child(3) > div::after { content: "Partner-\A programm"; white-space: pre; color:#fff; font-size: 22px; font-weight:300; line-height:1.2; }
[style*="grid-template-columns: 2fr 1fr 1fr"] > div:nth-child(4) > div::after { content: "Stripe-\A Migration"; white-space: pre; color:#fff; font-size: 22px; font-weight:300; line-height:1.2; }
[style*="grid-template-columns: 2fr 1fr 1fr"] > div > div { box-shadow: inset 0 -80px 80px -40px rgba(0,0,0,.45); }

/* CTA-Sektion: konsistent zentriert, sub-items nicht mehr links ausgerichtet */
.section.cta { padding-top: 72px !important; padding-bottom: 72px !important; border-top: 1px solid var(--surface-border); }
.section.cta h2 { font-size: clamp(32px, 3.6vw, 44px) !important; }
.section.cta > .reveal > p { max-width: 560px !important; font-size: 17px !important; }
.section.cta .cta__sub { max-width: 720px !important; margin-top: 48px !important; padding-top: 32px !important; border-top: 1px solid var(--surface-border); }
.section.cta .cta__sub-item { text-align: center !important; }
.section.cta .cta__sub-item h4 { margin-bottom: 6px !important; }
.section.cta .cta__sub-item p { margin-bottom: 8px !important; }

/* Stats-Marquee Edge-Fade (gleich wie Logos) */
.stats { -webkit-mask-image: linear-gradient(to right, transparent, #000 6%, #000 94%, transparent); mask-image: linear-gradient(to right, transparent, #000 6%, #000 94%, transparent); }

/* Footer-Bottom: zentrierter, Logo + Copy nicht mehr meilenweit auseinander */
.footer__bottom { max-width: 1080px; margin: 0 auto; }

/* Bento früher zweispaltig, damit Visuals auf Tablet nicht gequetscht werden */
@media (max-width: 1024px) and (min-width: 769px) {
  .bento { grid-template-columns: repeat(2, 1fr); }
  .bento__card--span2 { grid-column: span 2; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 24px; }
}

/* News-Grid auf Mobile: stack statt 4-Spalten */
@media (max-width: 768px) {
  [style*="grid-template-columns: 2fr 1fr 1fr"] { grid-template-columns: 1fr 1fr !important; }
}

[style*="rgb(124, 58, 237)"][style*="rgb(192, 132, 252)"] { background-image: linear-gradient(180deg, rgba(10,37,64,.15), rgba(10,37,64,.65)), url("https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=900&q=70") !important; background-size: cover !important; background-position: center !important; }
[style*="background: rgb(42, 26, 10)"] { background-image: linear-gradient(180deg, rgba(0,0,0,.1), rgba(0,0,0,.6)), url("https://images.unsplash.com/photo-1556761175-5973dc0f32e7?auto=format&fit=crop&w=600&q=70") !important; background-size: cover !important; background-position: center !important; }
[style*="background: rgb(10, 58, 42)"] { background-image: linear-gradient(180deg, rgba(0,0,0,.1), rgba(0,0,0,.6)), url("https://images.unsplash.com/photo-1521791136064-7986c2920216?auto=format&fit=crop&w=600&q=70") !important; background-size: cover !important; background-position: center !important; }
[style*="background: rgb(26, 26, 58)"] { background-image: linear-gradient(180deg, rgba(0,0,0,.1), rgba(0,0,0,.6)), url("https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=600&q=70") !important; background-size: cover !important; background-position: center !important; }
.enterprise__visual, .enterprise__visual-inner { background-image: linear-gradient(135deg, rgba(83,58,253,.18), rgba(255,128,181,.10)), url("https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1000&q=70") !important; background-size: cover !important; background-position: center !important; }
@media (max-width: 768px) {
  :root { --nav-height: 60px; }
  .nav { padding: 0 16px; }
  .nav__signin { display: none; }
  .nav__cta { padding: 6px 12px; font-size: 13px; }
  .hero { min-height: auto; padding-bottom: 32px; }
  .hero__content { padding: calc(var(--nav-height) + 32px) 20px 24px; }
  .hero__wave, .hero > canvas { display: none !important; }
  .hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 180px; z-index: 0; pointer-events: none; background: radial-gradient(120% 100% at 80% 100%, rgba(83,58,253,.18), transparent 60%), radial-gradient(80% 80% at 20% 100%, rgba(255,128,181,.18), transparent 60%); }
  .hero__title { font-size: 30px; line-height: 1.1; }
  .hero__subtitle { font-size: 15px; }
  .section { padding: 56px 20px; }
  .section__header { margin-bottom: 32px; }
  .footer { padding: 48px 20px 24px; }
  .stats { padding: 36px 0; }
  .stats__item { padding: 0 32px; }
  .logos { margin: 0 16px; padding: 18px 0; }
  .logos__item { padding: 0 20px; font-size: 16px; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .cta__sub { grid-template-columns: 1fr; }
  .news-scroll { gap: 12px; }
  .news-card { min-width: 260px; max-width: 260px; padding: 22px; }
}
@media (max-width: 480px) {
  .footer__bottom { flex-direction: column; gap: 12px; align-items: flex-start; }
  .hero__actions { width: 100%; }
  .hero__actions .btn-primary, .hero__actions .btn-secondary { flex: 1; justify-content: center; }
}
</style>
